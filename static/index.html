<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0a0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<title>Whisper Room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0f1a;--surface:#111827;--surface2:#1a2332;--accent:#00d4ff;--accent-glow:#00d4ff33;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;--radius:10px;--danger:#ef4444;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius);border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
.btn-primary{background:var(--accent);color:#0a0f1a}.btn-primary:hover{box-shadow:0 0 16px var(--accent-glow)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:var(--border)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:var(--danger);color:#fff}
input,textarea{width:100%;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;outline:none;transition:.15s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
textarea{resize:vertical;min-height:60px;font-family:inherit}

/* Auth screen */
#auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
#auth-screen h1{font-size:28px;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#auth-screen p.sub{color:var(--muted);margin-bottom:24px;font-size:14px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border-radius:16px;padding:24px;border:1px solid var(--border)}
.auth-card h2{font-size:18px;margin-bottom:16px}
.auth-card input{margin-bottom:10px}
.auth-card .btn{width:100%;justify-content:center;margin-top:6px}
.auth-toggle{text-align:center;margin-top:12px;font-size:13px;color:var(--muted)}
.auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:none}

/* App layout */
#app{flex:1;display:flex;flex-direction:column;height:100vh}
#app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
#app-header h2{font-size:17px;display:flex;align-items:center;gap:8px}
#app-header .user-info{font-size:12px;color:var(--muted)}
#main-content{flex:1;overflow-y:auto;padding:12px 12px 72px}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;text-align:center;padding:8px 0;font-size:11px;color:var(--muted);cursor:pointer;transition:.1s}
.nav-item.active{color:var(--accent)}
.nav-item svg{display:block;margin:0 auto 2px}

/* Compose */
/* Group room (feed = chat) */
#room-area{display:flex;flex-direction:column;height:calc(100vh - 130px)}
#room-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#room-input-area{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border)}
#room-input-area input{flex:1}

/* Tabs content */
.tab-content{display:none}
.tab-content.active{display:block}

/* Profile */
.profile-card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--border);margin-bottom:10px}
.profile-card .stat-row{display:flex;justify-content:space-around;margin:12px 0}
.profile-card .stat{text-align:center}
.profile-card .stat .num{font-size:22px;font-weight:700;color:var(--accent)}
.profile-card .stat .label{font-size:11px;color:var(--muted)}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge-item{font-size:12px;background:var(--surface2);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}

/* Shop */
.shop-item{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.shop-item .info{flex:1}
.shop-item .title{font-weight:600;font-size:14px}
.shop-item .desc{font-size:12px;color:var(--muted)}
.shop-item .price{font-size:14px;font-weight:700;color:var(--accent)}

/* Leaderboard */
.lb-entry{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.lb-entry .rank{width:32px;font-weight:700;color:var(--accent)}
.lb-entry .alias{flex:1}
.lb-entry .pts{color:var(--muted);font-size:12px}
.lb-entry.is-me{color:var(--accent)}
.lb-entry.featured .alias::after{content:" ★";color:var(--accent)}

/* Challenges */
.challenge{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--border);margin-bottom:8px}
.challenge .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.challenge .head h4{font-size:14px}
.challenge .progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:6px 0}
.challenge .progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:.3s}

/* Modal overlay */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:400px;border:1px solid var(--border);max-height:80vh;overflow-y:auto}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);padding:10px 20px;border-radius:var(--radius);z-index:300;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:fadeIn .2s}
.toast.error{border-color:var(--danger)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Sort bar (kept for potential reuse) */
.sort-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding:2px 0}

.empty-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.loading{text-align:center;padding:20px;color:var(--muted)}

/* Badge selector */
.badge-select{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.badge-opt{padding:6px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:12px;background:var(--surface2)}
.badge-opt.selected{border-color:var(--accent);background:var(--accent);color:#0a0f1a}

/* Message bubbles (shared: room feed) */
.msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4;word-break:break-word}
.msg.mine{align-self:flex-end;background:var(--accent);color:#0a0f1a;border-bottom-right-radius:4px}
.msg.theirs{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .sender{font-size:11px;color:var(--muted);margin-bottom:2px}
.msg.mine .sender{color:rgba(0,0,0,.5)}
.msg .time{font-size:10px;color:var(--muted);text-align:right;margin-top:2px}
</style>
</head>
<body>

<div id="auth-screen">
  <h1>Whisper Room</h1>
  <p class="sub">Anonymous confessions. Real accountability.</p>
  <div class="auth-card" id="login-form">
    <h2>Sign In</h2>
    <input type="text" id="login-id" placeholder="Email or handle" autocomplete="username">
    <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" onclick="login()">Sign In</button>
    <div class="auth-toggle">Don't have an account? <a onclick="showRegister()">Register</a></div>
    <div class="auth-toggle" style="margin-top:4px"><a onclick="showForgot()">Forgot password?</a></div>
  </div>
  <div class="auth-card hidden" id="register-form">
    <h2>Register</h2>
    <input type="text" id="reg-name" placeholder="Real name">
    <input type="email" id="reg-email" placeholder="Email">
    <input type="text" id="reg-handle" placeholder="Public handle (3-20 chars)">
    <input type="password" id="reg-pass" placeholder="Password (min 4 chars)">
    <button class="btn btn-primary" onclick="register()">Create Account</button>
    <div class="auth-toggle">Already registered? <a onclick="showLogin()">Sign In</a></div>
  </div>
  <div class="auth-card hidden" id="forgot-form">
    <h2>Forgot Password</h2>
    <input type="text" id="forgot-handle" placeholder="Your handle">
    <button class="btn btn-primary" onclick="forgotPassword()">Request Reset</button>
    <div class="auth-toggle"><a onclick="showLogin()">Back to Sign In</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="app-header">
    <h2>💬 Whisper Room</h2>
    <div class="user-info">
      <span id="header-bell" title="Enable notifications" style="cursor:pointer;font-size:14px;opacity:.45" onclick="togglePush()">🔔</span>
      <span id="header-handle"></span>
      <span style="margin:0 6px;color:var(--muted)">·</span>
      <span id="header-pts" style="color:var(--accent)"></span>
      <span style="margin:0 6px;color:var(--muted)">|</span>
      <a style="color:var(--muted);cursor:pointer;font-size:12px" onclick="logout()">logout</a>
    </div>
  </div>
  <div id="main-content">
    <!-- Feed tab = group chat -->
    <div class="tab-content active" id="tab-feed">
      <div id="room-area">
        <div id="room-msgs"></div>
        <div id="room-input-area">
          <input id="room-input" placeholder="Message the group…" maxlength="500" onkeydown="if(event.key==='Enter')sendRoomMsg()">
          <button class="btn btn-sm btn-primary" onclick="sendRoomMsg()">Send</button>
        </div>
      </div>
    </div>
    <!-- Leaderboard tab -->
    <div class="tab-content" id="tab-leaderboard">
      <h3 style="margin-bottom:10px;font-size:16px">🏆 Leaderboard</h3>
      <div id="leaderboard"></div>
      <h3 style="margin:16px 0 10px;font-size:16px">🎯 Challenges</h3>
      <div id="challenges"></div>
    </div>
    <!-- Profile/Shop tab -->
    <div class="tab-content" id="tab-profile">
      <h3 style="margin-bottom:10px;font-size:16px">👤 Profile</h3>
      <div id="profile-area"></div>
      <h3 style="margin:16px 0 10px;font-size:16px">🏪 Shop</h3>
      <div id="shop"></div>
    </div>
  </div>
  <div id="bottom-nav">
    <div class="nav-item active" data-tab="feed">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Feed
    </div>
    <div class="nav-item" data-tab="leaderboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 6 9 6 9z"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 18 9 18 9z"/><path d="M4 22h16"/><path d="M10 22V2h4v20"/><path d="M6 14v-3"/><path d="M18 14v-3"/></svg>
      Top
    </div>
    <div class="nav-item" data-tab="profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Me
    </div>
  </div>
</div>

<script>
let state = { user: null, pushOn: false };

function $(id){return document.getElementById(id)}

function toast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

async function api(method, path, body){
  const opts = { method, headers: {} };
  if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const data = await r.json();
  if(!r.ok){ throw new Error(data.error || `HTTP ${r.status}`); }
  return data;
}

/* ======= PWA + Push notifications ======= */

// Register the service worker (app installability + push delivery)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

function urlBase64ToUint8Array(b64){
  const pad = b64.replace(/=+$/, '');
  const bin = atob(pad.replace(/-/g, '+').replace(/_/g, '/'));
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

async function syncPushState(){
  const bell = $('header-bell');
  if(!bell || !pushSupported()) return;
  try {
    const cfg = await api('GET', '/api/push/config');
    if(!cfg.enabled){ bell.style.display = 'none'; return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    const on = !!sub;
    state.pushOn = on;
    bell.style.opacity = on ? 1 : .45;
    bell.title = on ? 'Notifications on — tap to turn off' : 'Enable notifications';
  } catch(e){ /* ignore */ }
}

async function togglePush(){
  if(!pushSupported()){ toast('Notifications not supported on this device/browser.', true); return; }
  try {
    const cfg = await api('GET', '/api/push/config');
    if(!cfg.enabled){ toast('Notifications are not configured yet.', true); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub){
      // turn off
      try { await api('POST', '/api/push/unsubscribe', { endpoint: sub.endpoint }); } catch(e){}
      await sub.unsubscribe().catch(() => {});
      state.pushOn = false;
      $('header-bell').style.opacity = .45;
      $('header-bell').title = 'Enable notifications';
      toast('Notifications off');
      return;
    }
    // turn on — requestPermission MUST come from this user gesture
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Permission denied by browser.', true); return; }
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(cfg.vapid_public)
    });
    await api('POST', '/api/push/subscribe', {
      endpoint: sub.endpoint,
      keys: { p256dh: sub.keys.p256dh, auth: sub.keys.auth }
    });
    state.pushOn = true;
    $('header-bell').style.opacity = 1;
    $('header-bell').title = 'Notifications on — tap to turn off';
    toast('🔔 Notifications on! You\u2019ll be pinged when someone chats.');
  } catch(e){ toast(e.message, true); }
}

/* Auth */
function showRegister(){ $('login-form').classList.add('hidden'); $('register-form').classList.remove('hidden'); $('forgot-form').classList.add('hidden'); }
function showLogin(){ $('login-form').classList.remove('hidden'); $('register-form').classList.add('hidden'); $('forgot-form').classList.add('hidden'); }
function showForgot(){ $('login-form').classList.add('hidden'); $('register-form').classList.add('hidden'); $('forgot-form').classList.remove('hidden'); }

async function register(){
  try {
    const d = await api('POST', '/api/register', {
      real_name: $('reg-name').value.trim(),
      email: $('reg-email').value.trim(),
      handle: $('reg-handle').value.trim(),
      password: $('reg-pass').value
    });
    toast('Registered!');
    enterApp(d.handle);
  } catch(e){ toast(e.message, true); }
}

async function login(){
  try {
    const d = await api('POST', '/api/login', {
      identifier: $('login-id').value.trim(),
      password: $('login-pass').value
    });
    enterApp(d.handle);
  } catch(e){ toast(e.message, true); }
}

async function forgotPassword(){
  try {
    const d = await api('POST', '/api/forgot-password', { handle: $('forgot-handle').value.trim() });
    toast(d.message);
    showLogin();
  } catch(e){ toast(e.message, true); }
}

function logout(){
  state.user = null;
  if(roomPollTimer){ clearInterval(roomPollTimer); roomPollTimer = null; }
  $('app').classList.add('hidden');
  $('auth-screen').classList.remove('hidden');
  $('login-id').value = '';
  $('login-pass').value = '';
}

async function enterApp(handle){
  $('auth-screen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('header-handle').textContent = '@' + handle;
  state.user = { handle };
  loadProfile();
  loadLeaderboard();
  startRoomPolling();
  syncPushState();
}

/* Navigation */
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    $(`tab-${el.dataset.tab}`).classList.add('active');
    if(el.dataset.tab === 'feed') loadRoom();
    if(el.dataset.tab === 'leaderboard') { loadLeaderboard(); loadChallenges(); }
    if(el.dataset.tab === 'profile') { loadProfile(); loadShop(); }
  });
});

/* ======= Group Room (Feed = group chat) ======= */

let roomPollTimer = null;

function startRoomPolling(){
  if(roomPollTimer) return;
  loadRoom();
  roomPollTimer = setInterval(loadRoom, 2000);
}

async function loadRoom(){
  try {
    const d = await api('GET', '/api/feed');
    const el = $('room-msgs');
    if(!d.messages || !d.messages.length){
      if(!el.querySelector('.empty-state')) el.innerHTML = '<div class="empty-state" style="padding:20px">No messages yet. Say hello! 👋</div>';
      return;
    }
    el.innerHTML = d.messages.map(renderMessage).join('');
    el.scrollTop = el.scrollHeight;
  } catch(e){ /* ignore */ }
}

async function sendRoomMsg(){
  const input = $('room-input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  try {
    const d = await api('POST', '/api/feed', { text });
    if(d.points !== undefined) $('header-pts').textContent = d.points + ' pts';
    loadProfile();
    await loadRoom();
  } catch(e){ toast(e.message, true); }
}

function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* Profile */
async function loadProfile(){
  try {
    const d = await api('GET', '/api/me');
    $('header-pts').textContent = d.points + ' pts';
    let html = `<div class="profile-card">
      <div style="font-size:18px;font-weight:700">@${d.handle}</div>
      <div class="stat-row">
        <div class="stat"><div class="num">${d.points}</div><div class="label">Points</div></div>
        <div class="stat"><div class="num">${d.streak || 0}🔥</div><div class="label">Streak</div></div>
        <div class="stat"><div class="num">#${d.rank || '—'}</div><div class="label">Rank</div></div>
      </div>`;
    if(d.streak_at_risk_today) html += `<div style="text-align:center;color:var(--danger);font-size:13px;margin-bottom:8px">⚠️ Post today to keep your streak!</div>`;
    if(d.badges && d.badges.length){
      html += '<div class="badge-row">' + d.badges.map(b => `<span class="badge-item">${b.label}</span>`).join('') + '</div>';
    }
    html += '</div>';
    $('profile-area').innerHTML = html;
  } catch(e){ /* ignore */ }
}

/* Shop */
async function loadShop(){
  try {
    const d = await api('GET', '/api/shop');
    const items = d.items || {};
    const keys = Object.keys(items);
    if(!keys.length){ $('shop').innerHTML = '<div class="empty-state">Shop empty.</div>'; return; }
    $('shop').innerHTML = keys.map(k => {
      const it = items[k];
      return `<div class="shop-item">
        <div class="info">
          <div class="title">${it.label}</div>
          <div class="desc">${it.desc}</div>
        </div>
        <div><div class="price">${it.price} pts</div>
        <button class="btn btn-sm btn-primary" onclick="buyItem('${k}')">Buy</button></div>
      </div>`;
    }).join('');
  } catch(e){ $('shop').innerHTML = '<div class="empty-state">Shop unavailable.</div>'; }
}

async function buyItem(kind){
  try {
    const d = await api('POST', '/api/shop/buy', { kind });
    toast(`Purchased! ${d.points} pts remaining`);
    loadProfile();
    loadShop();
  } catch(e){ toast(e.message, true); }
}

/* Leaderboard */
async function loadLeaderboard(){
  try {
    const d = await api('GET', '/api/leaderboard');
    if(!d.leaderboard || !d.leaderboard.length){ $('leaderboard').innerHTML = '<div class="empty-state">No rankings yet.</div>'; return; }
    $('leaderboard').innerHTML = d.leaderboard.map((e, i) =>
      `<div class="lb-entry ${e.is_me ? 'is-me' : ''} ${e.featured ? 'featured' : ''}">
        <span class="rank">${medal(i+1)}</span>
        <span class="alias">${e.alias}</span>
        <span class="pts">${e.points} pts</span>
      </div>`
    ).join('');
  } catch(e){ $('leaderboard').innerHTML = '<div class="empty-state">Could not load leaderboard.</div>'; }
}
function medal(n){ if(n===1) return '🥇'; if(n===2) return '🥈'; if(n===3) return '🥉'; return n; }

/* Challenges */
async function loadChallenges(){
  try {
    const d = await api('GET', '/api/challenges');
    if(!d.challenges || !d.challenges.length){ $('challenges').innerHTML = '<div class="empty-state">No challenges this week.</div>'; return; }
    $('challenges').innerHTML = d.challenges.map(c => {
      const pct = c.goal > 0 ? Math.round(c.progress / c.goal * 100) : 0;
      const done = c.completed && !c.claimed;
      return `<div class="challenge">
        <div class="head">
          <h4>${c.label}</h4>
          <span style="font-size:13px;color:var(--muted)">${c.progress}/${c.goal}</span>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div style="font-size:12px;color:var(--muted)">Reward: ${c.reward} pts</div>
        ${done ? `<button class="btn btn-sm btn-primary" onclick="claimChallenge('${c.key}')" style="margin-top:6px">Claim</button>` : ''}
        ${c.claimed ? '<span style="font-size:12px;color:var(--accent)">✓ Claimed</span>' : ''}
      </div>`;
    }).join('');
  } catch(e){ $('challenges').innerHTML = ''; }
}

async function claimChallenge(key){
  try { await api('POST', `/api/challenges/${key}/claim`); toast('Claimed!'); loadChallenges(); loadProfile(); } catch(e){ toast(e.message, true); }
}

/* ======= Message rendering (shared by room feed) ======= */

function renderMessage(m){
  const isMine = m.sender_handle === (state.user && state.user.handle);
  return `<div class="msg ${isMine ? 'mine' : 'theirs'}">
    ${!isMine ? `<div class="sender">@${escHtml(m.sender_handle)}</div>` : ''}
    <div>${escHtml(m.text)}</div>
    <div class="time">${timeAgo(m.created_at)}</div>
  </div>`;
}

function timeAgo(iso){
  const sec = (Date.now() - new Date(iso).getTime()) / 1000;
  if(sec < 60) return 'now';
  if(sec < 3600) return Math.floor(sec/60)+'m';
  if(sec < 86400) return Math.floor(sec/3600)+'h';
  return Math.floor(sec/86400)+'d';
}
</script>
