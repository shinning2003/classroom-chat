<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Whisper Room — Admin</title>
<style>
:root{--bg:#0a0f1a;--surface:#111827;--surface2:#1a2332;--accent:#00d4ff;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;--radius:10px;--danger:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px}
h1{font-size:22px;margin-bottom:16px}
h2{font-size:16px;margin:16px 0 8px}
input,select,textarea{padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;outline:none}
input:focus{border-color:var(--accent)}
button{padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn-primary{background:var(--accent);color:#0a0f1a}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
.actions{display:flex;gap:4px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);padding:10px 20px;border-radius:var(--radius);z-index:300;font-size:14px}
.hidden{display:none!important}
a{color:var(--accent);cursor:pointer}
</style>
</head>
<body>

<h1>🔐 Admin Panel</h1>

<div id="login-area">
  <div class="card" style="max-width:320px">
    <input type="password" id="admin-pass" placeholder="Admin password" style="width:100%;margin-bottom:8px" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="btn-primary" onclick="adminLogin()">Login</button>
  </div>
</div>

<div id="panel" class="hidden">
  <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">
    <button class="btn-ghost" onclick="loadUsers()">👥 Users</button>
    <button class="btn-ghost" onclick="loadRumors()">📝 Rumors</button>
    <button class="btn-ghost" onclick="logout()">🚪 Logout</button>
  </div>

  <div id="admin-content"></div>
</div>

<script>
async function api(method, path, body){
  const opts={method,headers:{}};
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}
  const r=await fetch(path,opts);
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'HTTP '+r.status);
  return d;
}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}

async function adminLogin(){
  try{await api('POST','/api/admin/login',{password:document.getElementById('admin-pass').value});showPanel()}catch(e){toast(e.message)}
}

// The admin session cookie is persistent (30 days), so restore the panel
// on load instead of forcing a fresh login — and keep logout real by
// clearing the server session too. Only a definitive 401/403 lands on the
// login card; transient failures (cold start, 5xx) retry silently.
(async function restoreAdmin(){
  try{
    const r = await fetch('/api/admin/me', { cache: 'no-store' });
    if(r.ok){ showPanel(); return; }
    if(r.status === 401 || r.status === 403){ return; } // stay on login card
    setTimeout(restoreAdmin, 3000);
  }catch(e){
    setTimeout(restoreAdmin, 3000);
  }
})();

function showPanel(){
  document.getElementById('login-area').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  loadUsers();
}

async function logout(){
  try{await api('POST','/api/admin/logout')}catch(e){}
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('login-area').classList.remove('hidden');
  document.getElementById('admin-pass').value='';
}

async function loadUsers(){
  const el=document.getElementById('admin-content');
  try{
    const d=await api('GET','/api/admin/users');
    if(!d.users||!d.users.length){el.innerHTML='<div class="card">No users.</div>';return}
    el.innerHTML=`<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Handle</th><th>Banned</th><th>Points</th><th>Actions</th></tr></thead><tbody>
      ${d.users.map(u=>`<tr>
        <td>${u.id}</td>
        <td>${esc(u.real_name)}</td>
        <td>${esc(u.email)}</td>
        <td>@${esc(u.handle)}</td>
        <td>${u.banned?'❌':'✅'}</td>
        <td>${u.points}</td>
        <td class="actions">
          <button class="btn-ghost" onclick="grantPoints(${u.id})">+pts</button>
          <button class="btn-ghost" onclick="resetPw(${u.id})">pw</button>
          ${u.banned?'':`<button class="btn-danger" onclick="banUser(${u.id})">ban</button>`}
        </td>
      </tr>`).join('')}
    </tbody></table>`;
  }catch(e){el.innerHTML='<div class="card">Error: '+e.message+'</div>'}
}

async function loadRumors(){
  const el=document.getElementById('admin-content');
  try{
    const d=await api('GET','/api/admin/rumors');
    if(!d.rumors||!d.rumors.length){el.innerHTML='<div class="card">No rumors.</div>';return}
    el.innerHTML=`<table><thead><tr><th>ID</th><th>Text</th><th>Handle</th><th>Real Name</th><th>Date</th><th>Actions</th></tr></thead><tbody>
      ${d.rumors.map(r=>`<tr>
        <td>${r.id}</td>
        <td>${esc(r.text.substring(0,60))}${r.text.length>60?'…':''}</td>
        <td>@${esc(r.handle)}</td>
        <td>${esc(r.real_name)}</td>
        <td>${new Date(r.created_at).toLocaleDateString()}</td>
        <td class="actions">
          <button class="btn-danger" onclick="deleteRumor(${r.id})">del</button>
          <button class="btn-ghost" onclick="featureRumor(${r.id})">✨ feature</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
  }catch(e){el.innerHTML='<div class="card">Error: '+e.message+'</div>'}
}

async function grantPoints(uid){
  const amt=prompt('Points to award?');
  if(!amt)return;
  try{await api('POST',`/api/admin/users/${uid}/grant-points`,{amount:parseInt(amt)});toast('Granted!');loadUsers()}catch(e){toast(e.message)}
}
async function resetPw(uid){
  const pw=prompt('New password (min 4 chars)?');
  if(!pw)return;
  try{await api('POST',`/api/admin/users/${uid}/reset-password`,{new_password:pw});toast('Password reset!')}catch(e){toast(e.message)}
}
async function banUser(uid){
  if(!confirm('Ban this user? Their rumors will be deleted.'))return;
  try{await api('DELETE',`/api/admin/users/${uid}`);toast('Banned!');loadUsers()}catch(e){toast(e.message)}
}
async function deleteRumor(rid){
  if(!confirm('Delete this rumor?'))return;
  try{await api('DELETE',`/api/admin/rumors/${rid}`);toast('Deleted!');loadRumors()}catch(e){toast(e.message)}
}
async function featureRumor(rid){
  try{await api('POST',`/api/admin/rumors/${rid}/feature`);toast('Featured!');loadRumors()}catch(e){toast(e.message)}
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
</script>
</body>
</html>
